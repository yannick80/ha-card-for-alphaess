name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const VERSION = \"${tag}\";" dist/alphaess-card.js || {
            echo "VERSION in dist/alphaess-card.js does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Upload alphaess-card.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/alphaess-card.js --clobber
