name: Bug report
description: The card shows something wrong, shows an error or does not load.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Wrong or missing sensor values on the device page itself are an AlphaESS Modbus TCP topic:
        please report those at https://github.com/senalse/ha-alphaess-modbus/issues.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: input
    id: card_version
    attributes:
      label: Card version
      description: Shown in the browser console (F12) as `alphaess-card x.y.z`.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: AlphaESS Modbus TCP version
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      placeholder: e.g. SMILE5
  - type: input
    id: browser
    attributes:
      label: Browser or app
      placeholder: e.g. Chrome 131, HA Companion app on iOS, Shelly Wall Display
  - type: textarea
    id: yaml
    attributes:
      label: Card YAML
      render: yaml
  - type: textarea
    id: states
    attributes:
      label: Sensor states and screenshot
      description: >
        A screenshot of the card and of the inverter's sensors on its device page.
        Remove serial numbers and IP addresses before posting.
